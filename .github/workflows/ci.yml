name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # The build reads no database, but the seed script does, so the whole
    # pipeline runs against the same PostgreSQL 17 the team runs locally.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moonlight
          POSTGRES_PASSWORD: moonlight
          POSTGRES_DB: moonlight
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U moonlight -d moonlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://moonlight:moonlight@localhost:5433/moonlight

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Seed is re-runnable
        run: pnpm db:seed

      # A virgin database is the easy case. The one that broke in review is a
      # candidate who withdrew a seeded application and applied again, so the
      # row exists under a generated id rather than the seeded one.
      - name: Seed survives a database the app has been used on
        env:
          PGPASSWORD: moonlight
        run: |
          psql -h localhost -p 5433 -U moonlight -d moonlight \
            -c "DELETE FROM applications WHERE id = 'a001'" \
            -c "INSERT INTO applications (profile_id, vacancy_id) VALUES ('demo-candidate', 'v003')"
          pnpm db:seed

      - name: The MVP flow, end to end
        run: pnpm smoke

      - run: pnpm build
